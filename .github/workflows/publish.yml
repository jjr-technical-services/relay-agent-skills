name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.17.0

      - name: Report npm version
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"

      - name: Qualify package
        run: npm run verify:release && npm run verify:live && npm run validate:hosts -- --release && npm test && npm run pack:dry-run

      - name: Install pinned host CLIs
        run: npm install --global @openai/codex@0.147.0-alpha.6.5 @anthropic-ai/claude-code@2.1.183

      - name: Validate and install through disposable host profiles
        env:
          RELAY_DISPOSABLE_HOST_ENV: '1'
        run: claude plugin validate . --strict && npm run test:hosts

      - name: Publish with provenance
        run: npm publish --access public --provenance
